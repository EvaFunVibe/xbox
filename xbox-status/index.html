<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EvaFV Xbox Status</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0e0e0e; color:white; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .card { background:#107C10; padding:20px; border-radius:12px; box-shadow:0 0 20px rgba(0,0,0,0.5); width:320px; text-align:center; }
    img { border-radius:50%; width:100px; height:100px; margin-bottom:15px; }
    .status { font-size:18px; margin-top:10px; }
    .offline { color:#ff4d4d; }
    .online { color:#00ff90; }
  </style>
</head>
<body>
  <div class="card" id="xbox-card">
    <h2>Loading Xbox status…</h2>
  </div>

  <script>
    async function loadSummary() {
      try {
        const res = await fetch("/api/xbox-summary");
        const player = await res.json();

        if (player.error) {
          document.getElementById("xbox-card").innerHTML =
            `<h2 style="color:red">${player.error}</h2>`;
          return;
        }

        const statusClass = player.state === "Online" ? "online" : "offline";
        document.getElementById("xbox-card").innerHTML = `
          <img src="${player.profilePic}" alt="Profile Picture"/>
          <h2>${player.gamertag}</h2>
          <p>Gamerscore: ${player.gamerScore}</p>
          <p class="status ${statusClass}">
            ${player.state} – ${player.activity}
          </p>
        `;
      } catch (err) {
        document.getElementById("xbox-card").innerHTML =
          `<h2 style="color:red">Error: ${err.message}</h2>`;
      }
    }

    loadSummary();
  </script>
</body>
</html>
